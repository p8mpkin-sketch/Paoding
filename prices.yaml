# 价目表（端点代理计量用）。版本号写进每条 cost 事件，重放稳定（§3.5.2）。
# 单位：美元 / 百万 token。
# - Anthropic：一方 API 公开价，2026-11 缓存表；cache_write 按 5 分钟缓存取输入价的 1.25 倍。上线前以官网价目核对一次。
# - DeepSeek：官方标价，2026-11（cz 2026-11-18 给出）。DeepSeek 自动缓存、不另收写入费，cache_write 按输入价。
# 一张表一个版本号，两家各自的来源版本用 + 连起来。
version: anthropic@2026-11-03+deepseek@2026-11
models:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
  deepseek-chat:     {input: 0.27, output: 1.10, cache_read: 0.07, cache_write: 0.27}
  deepseek-flash:    {input: 0.27, output: 1.10, cache_read: 0.07, cache_write: 0.27}  # 暂按 deepseek-chat 档（官方价待补）
  deepseek-reasoner: {input: 0.55, output: 2.19, cache_read: 0.14, cache_write: 0.55}

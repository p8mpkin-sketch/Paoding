[project]
name = "paoding"
version = "0.0.0"
description = "庖丁基座 M0（monorepo 根，EDR-001 D-4）"
requires-python = ">=3.12"
dependencies = [
  "paoding-pd",
  "paoding-graph",
  "paoding-adapter",
  "paoding-executor",
  "paoding-judgebox",
  "paoding-watchdog",
  "paoding-eval",
  "paoding-sinan",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv.sources]
paoding-pd = { workspace = true }
paoding-graph = { workspace = true }
paoding-adapter = { workspace = true }
paoding-executor = { workspace = true }
paoding-judgebox = { workspace = true }
paoding-watchdog = { workspace = true }
paoding-eval = { workspace = true }
paoding-sinan = { workspace = true }

[tool.uv.workspace]
members = ["pd", "graph", "adapter", "executor", "judgebox", "watchdog", "eval", "sinan"]

[tool.pytest.ini_options]
testpaths = ["graph/tests", "pd/tests", "adapter/tests", "executor/tests", "judgebox/tests", "watchdog/tests", "eval/tests", "sinan/tests", "ci/tests", "tests/integration"]

# 覆盖率（P2-3）：只量组件源码与组装脚本。CI 里 `pytest --cov` 之后由 ci/coverage_by_component.py 按组件汇总。
# 子进程里跑的代码（假 CLI、被测试起成子进程的 run.py）量不到，读数因此偏低而不偏高。
[tool.coverage.run]
branch = true
source = ["pd/src", "graph/src", "adapter/src", "executor/src", "judgebox/src", "watchdog/src", "eval/src", "sinan/src", "scripts"]
omit = ["scripts/e2e/*"]

[tool.coverage.report]
skip_empty = true

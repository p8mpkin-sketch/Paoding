[project]
name = "paoding"
license = "Apache-2.0"
version = "0.0.0"
description = "庖丁基座 M0（monorepo 根，EDR-001 D-4）"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "paoding-pd",
  "paoding-graph",
  "paoding-adapter",
  "paoding-executor",
  "paoding-judgebox",
  "paoding-watchdog",
  "paoding-eval",
  "paoding-sinan",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17.5",
]

[tool.uv.sources]
paoding-pd = { workspace = true }
paoding-graph = { workspace = true }
paoding-adapter = { workspace = true }
paoding-executor = { workspace = true }
paoding-judgebox = { workspace = true }
paoding-watchdog = { workspace = true }
paoding-eval = { workspace = true }
paoding-sinan = { workspace = true }

[tool.uv.workspace]
members = ["pd", "graph", "adapter", "executor", "judgebox", "watchdog", "eval", "sinan"]

[tool.pytest.ini_options]
testpaths = ["graph/tests", "pd/tests", "adapter/tests", "executor/tests", "judgebox/tests", "watchdog/tests", "eval/tests", "sinan/tests", "ci/tests", "tests/integration"]

# 覆盖率（P2-3）：只量组件源码与组装脚本。CI 里 `pytest --cov` 之后由 ci/coverage_by_component.py 按组件汇总。
# 子进程里跑的代码（假 CLI、被测试起成子进程的 run.py）量不到，读数因此偏低而不偏高。
[tool.coverage.run]
branch = true
source = ["pd/src", "graph/src", "adapter/src", "executor/src", "judgebox/src", "watchdog/src", "eval/src", "sinan/src", "scripts"]
omit = ["scripts/e2e/*"]

[tool.coverage.report]
skip_empty = true

# 类型检查（P1-4）：graph/ 全量 strict。refmodel.py 是参考模型的逐字节副本（CI 比对），不在这里改它，
# 所以它自身的报错不看，对它的调用也不算"调用无类型函数"。
[tool.mypy]
python_version = "3.12"
strict = true
files = ["graph/src/paoding_graph"]
untyped_calls_exclude = ["paoding_graph.refmodel"]

[[tool.mypy.overrides]]
module = "paoding_graph.refmodel"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
# problems/ 是题目环境（数据），不是组件代码，不归这里管
extend-exclude = ["docs/design/reference-model", "graph/src/paoding_graph/refmodel.py", "web", "problems"]

[tool.ruff.lint]
# E/W/F：基本错误；I：导入顺序；B：常见缺陷；UP：过时写法；BLE：不许宽接 Exception（审计 P1-4）
select = ["E", "W", "F", "I", "B", "UP", "BLE"]
# E741：l、I 这类单字母名在本仓库里是惯用写法（lease、Intent），不改；UP031：% 格式化照用
ignore = ["E741", "UP031"]

[tool.ruff.lint.per-file-ignores]
# pytest 的 fixture 靠导入生效、靠同名参数取用，在 ruff 看来是“未使用”与“重定义”
"**/tests/**" = ["F401", "F811", "E731"]
"**/contract.py" = ["F401", "E402"]         # 契约模块就是再导出

[tool.ruff.lint.isort]
known-first-party = ["paoding_graph", "paoding_adapter", "paoding_executor", "paoding_judge", "paoding_sinan", "paoding_pd"]

# 一句话开题的确定性数据（设计 docs/design/kaiti）。领域词只许写在这类数据里，不进组件代码（红线 3）。
version: 1
# 答案标签：原文里以它们开头、后跟冒号的那一段剪出，存保密库，不进题面、不给起草模型
answer_labels: ["答案", "标准答案", "期望输出", "answer", "expected answer", "expected"]
# URL 换算成 host:port 时补的缺省端口
url_ports: {http: 80, https: 443}
# 金额换算：每单位折多少美元（预算记毫美元）。只有 usd；人民币汇率待有真实来源时再接（cz 2026-11-20：占位汇率删除，"N元"不当金额）
money_rates: {usd: 1.0}
# 没写协议和端口的域名（纯展示）：只认这些顶级域，免得把 main.py、notes.md 当域名
host_tlds: [com, net, org, io, dev, app, ai, cn, co, me, info, xyz, example, test, local, internal, lan, lab]
# command 判据的加重警告（external-verdict §5.8，往返意见 a）：命令里有这些写方法，或原文里有这些词，
# 确认卡要人勾“我确认这条命令只检查、不提交”才能创建；命令里有地址区间也算。只是提示，不是拒绝
command_outbound:
  verbs: ["-X POST", "-X PUT", "-X PATCH", "-X DELETE", "--request POST", "--data", "--data-raw", "--data-binary", "-d", "-F", "--form", "--upload-file", "-T"]
  words: ["提交", "上传", "submit", "upload"]
# 模板缺省（出处记"表"）
defaults:
  deliverable: answer.txt
  max_attempts: 5
  verify_share: 0.2
  bootstrap_share: 0.3
  env: {base: basic, baseline_ref: basic@1}
  answer_judge: exact_match
  command_judge: replay
  human_judge: structure_check   # 人工验收道的 Goal 判官：只看交付物形状（advisory）
  command_expect: {exit_code: 0}
  tier: medium              # 起草模型没有给档位、也没有确定性档位时
  fallback_budget: {usd_milli: 2000, wall_s: 1800}   # 先验数据源查不到时（占位）
# 零确认开关（cz 2026-11-19 裁决 #83 第 2 条附条件）：放行前一律走确认道；由人按 §10.3 离线读数达标后打开
zero_confirm: false

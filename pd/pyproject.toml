[project]
name = "paoding-pd"
license = "Apache-2.0"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
pd = "paoding_pd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paoding_pd"]
